[project]
name = "owltwin-app"
version = "0.1.0"
description = "Owl Twin: local OAuth vendor twin and connector test runner (dev only)"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
# No `ruff format`: it puts every argument on its own line. Wrap by hand, grouping
# related arguments (a flag with its value, a key with its value); `ruff check` keeps the limit.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
