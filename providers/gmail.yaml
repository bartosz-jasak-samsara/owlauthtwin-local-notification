# Owl Twin provider: Gmail (catalog entry "gmail", static broker provider "google-gmail").
# Dev only. The client ID is Samsara's public one from ucvoauthflow/providers.go. The secret is what a
# localdev ucvserver sends without SECRET_* set: the secret key name itself (infra/security/secrets mock).
schema: 1
id: gmail
name: Gmail connector
catalog_entry: gmail
oauth_client: google-gmail

hosts:
  browser:            # Chrome: Google's consent page
    - accounts.google.com
  server:             # devbox: token, revoke, Gmail MCP
    - oauth2.googleapis.com
    - gmailmcp.googleapis.com

# Google hosts are blocked unless listed here. Chrome reaches the Twin for them only while
# "Intercept sign-in" is on in the panel; the devbox side answers for the whole session.
idp_hosts:
  - accounts.google.com
  - oauth2.googleapis.com
  - gmailmcp.googleapis.com

client:
  id: 1022076456297-jlc27qjrcaacmvu64gctq8nj027r3kb2.apps.googleusercontent.com
  secret: app/ucv_gmail_client_secret
  auth: client_secret_post

endpoints:
  authorize: GET /o/oauth2/v2/auth
  token: POST /token
  revoke: POST /revoke
  mcp: POST /mcp/v1

oauth:
  pkce: S256
  require_state: true
  access_token_ttl: 3599
  rotate_refresh_token: false
  revoke_tokens_on_secret_rotation: false

consent:
  title: Samsara wants to access your Google Account

mcp:
  server_name: gmail-twin-mcp
  tools:
    - name: search_threads
      description: Search Gmail threads.
      input_schema:
        type: object
        properties:
          query: {type: string}
      result:
        threads:
          - {id: "thr-001", subject: "Truck 42 inspection report", from: "alice@acme-fleet.test", snippet: "Brake pads at 30%, schedule service."}
          - {id: "thr-002", subject: "Driver schedule next week", from: "marco@acme-fleet.test", snippet: "Updated shifts attached."}
    - name: get_thread
      description: Read a Gmail thread.
      input_schema:
        type: object
        properties:
          threadId: {type: string}
      result:
        messages:
          - {from: "alice@acme-fleet.test", body: "Brake pads at 30% on truck 42. Please schedule service this week."}
    - name: list_labels
      description: List Gmail labels.
      result:
        labels: [INBOX, Fleet, Safety]

test_prompt: Use Gmail to find emails about truck 42 and summarize them.

agent_studio: []
